name: Documentation Build

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - ".github/workflows/deploy_doc.yaml"
  pull_request:
    paths:
      - "doc/**"
      - ".github/workflows/deploy_doc.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv make latexmk \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r doc/requirements.txt
      - name: Build HTML and PDF documentation
        working-directory: doc
        run: |
          make all SPHINXBUILD=../.venv-docs/bin/sphinx-build
          make latexpdf SPHINXBUILD=../.venv-docs/bin/sphinx-build
          cp build/latex/*.pdf build/html/
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: hbirdv2_soc_doc
          path: doc/build/html
          if-no-files-found: error
